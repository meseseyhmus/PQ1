x-common-env: &common-env
  NODE_ENV: production
  HOSTNAME: 0.0.0.0

services:
  seoradar:
    build: ./seoradar
    image: seoradar:local
    container_name: seoradar
    restart: unless-stopped
    ports:
      - "3002:3002"
    environment:
      <<: *common-env
      PORT: 3002
    networks:
      - saas
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3002/ >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  konvertlab:
    build: ./konvertlab
    image: konvertlab:local
    container_name: konvertlab
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      <<: *common-env
      PORT: 3001
    networks:
      - saas
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3001/ >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  terneon:
    build: ./terneon
    image: terneon:local
    container_name: terneon
    restart: unless-stopped
    ports:
      - "3003:3003"
    environment:
      <<: *common-env
      PORT: 3003
    networks:
      - saas
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3003/ >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  parselya:
    build: ./parselya
    image: parselya:local
    container_name: parselya
    restart: unless-stopped
    ports:
      - "3004:3004"
    environment:
      <<: *common-env
      PORT: 3004
    networks:
      - saas
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3004/ >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

networks:
  saas:
    driver: bridge
